name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: test
    env:
      DB_PASSWORD: ci-password
      API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Record a deployment and read it back
        env:
          DEPLOY_LOG_URL: http://localhost:8091
          DEPLOY_LOG_TOKEN: ci-token
        run: |
          bash scripts/record-deploy.sh ci-service 1.0.0 staging
          curl --fail --silent http://localhost:8091/api/summary | grep -q ci-service

      - name: Logs on failure
        if: failure()
        run: docker compose logs
